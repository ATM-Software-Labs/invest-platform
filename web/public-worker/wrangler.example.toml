# Template for the `invest` Worker. Copy to wrangler.toml (gitignored) and fill in the placeholders.
# Deploy: npm ci && npm run build && npx wrangler deploy -c wrangler.toml
name = "invest"
main = "dist/worker.js"
compatibility_date = "<COMPATIBILITY_DATE>"   # keep the date of the deployed Worker
compatibility_flags = ["nodejs_compat"]
# account_id = "<CLOUDFLARE_ACCOUNT_ID>"

# routes = [{ pattern = "<INVEST_HOSTNAME>", custom_domain = true }]

# Subscribe attempts: 5 per hashed IP per 60s per Cloudflare location, before Turnstile.
# The Workers Rate Limiting binding does not write to KV. namespace_id is an integer you
# choose, unique in the account (not a KV id, nothing to create in the dashboard).
# Requires Wrangler >= 4.36. Period must be 10 or 60.
# https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
[[ratelimits]]
name = "SUBSCRIBE_RL"
namespace_id = "582741"

  [ratelimits.simple]
  limit = 5
  period = 60

# KV: per-address cooldown (hashed email, 15 min TTL) and cached Brevo ids
# (cfg:brevo:folder, cfg:brevo:list:*, cfg:brevo:doi). Not used for rate limiting.
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "<KV_NAMESPACE_ID>"

[vars]
BREVO_LIST_MARKETS = "<BREVO_LIST_MARKETS_ID>"   # Brevo list "Markets Digest"
BREVO_LIST_INVEST = "<BREVO_LIST_INVEST_ID>"     # Brevo list "INVEST Notas"
DOI_REPLY_TO = "soporte@example.com"             # Reply-To of the double opt-in template
# BREVO_DOI_TEMPLATE_ID = "<BREVO_DOI_TEMPLATE_ID>"  # optional: pin the DOI template

# Secrets (never in this file): BREVO_API_KEY, TURNSTILE_SECRET
#   npx wrangler secret put BREVO_API_KEY -c wrangler.toml
