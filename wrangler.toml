# Worker de producción `invest` (invest.trujillomingorance.com).
# Workers Builds ejecuta `npm run build` y luego `npx wrangler deploy` en la raíz.
# El bundle lo genera web/public-worker. Los secretos (BREVO_API_KEY, TURNSTILE_SECRET)
# no van aquí: se conservan los que ya están en el Worker.
# keep_vars conserva BREVO_LIST_* y DOI_REPLY_TO definidos en el panel.
name = "invest"
main = "web/public-worker/dist/worker.js"
account_id = "9c48e0ad7e36cf970f20839768fe8a64"
compatibility_date = "2026-09-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
keep_vars = true

# Límite de POST /api/subscribe: 5 intentos por IP cada 60 s, por ubicación de Cloudflare.
# Sustituye al contador en KV (rl:*). Ese put ocurría antes de Turnstile y un ataque
# podía agotar la cuota gratuita de escrituras KV de toda la cuenta (1.000/día).
# namespace_id es un entero elegido por nosotros, único en la cuenta; no es un namespace
# de KV y no hay que crearlo en el panel. Requiere Wrangler >= 4.36.
# https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
[[ratelimits]]
name = "SUBSCRIBE_RL"
namespace_id = "582741"

  [ratelimits.simple]
  limit = 5
  period = 60

[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "5557a9b8144342688d877a78a7136a92"

[[routes]]
pattern = "invest.trujillomingorance.com"
custom_domain = true

# Markets Briefing preferences (KV of the charts Worker `markets-digest`): only used to store the email language
# chosen by a NEW Markets subscriber (never overwrites an existing preference).
[[kv_namespaces]]
binding = "MARKETS_KV"
id = "6e77435f7d0a460cbd92ef217d5910c7"
